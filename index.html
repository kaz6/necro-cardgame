<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>持ち駒カードゲーム（仮） — プロト v0.2</title>
<link rel="icon" href="data:,">

<!--
  致命的エラーの表示（CG-008）
  ここだけは他のどのファイルより先に動かす。読み込み自体に失敗しても
  画面が真っ黒にならないよう、外部ファイルにはしない。
-->
<script>
(function () {
  var pending = [];

  function paint(title, detail) {
    var box = document.getElementById('fatal');
    if (!box) { pending.push([title, detail]); return; }
    box.style.display = 'block';
    var h = document.createElement('div');
    h.className = 'fatal-title';
    h.textContent = title;
    var p = document.createElement('pre');
    p.className = 'fatal-detail';
    p.textContent = detail;
    box.appendChild(h);
    box.appendChild(p);
  }

  function show(title, detail) {
    paint(title, detail == null ? '' : String(detail));
  }

  document.addEventListener('DOMContentLoaded', function () {
    var queued = pending;
    pending = [];
    for (var i = 0; i < queued.length; i++) paint(queued[i][0], queued[i][1]);
  });

  window.NECRO_FATAL = show;

  // 読み込み失敗（<script src> が取れない等）も拾うため capture で受ける
  window.addEventListener('error', function (e) {
    if (e.target && e.target !== window && e.target.src) {
      show('ファイルを読み込めませんでした', e.target.src);
      return;
    }
    show(
      'エラーが発生しました',
      [e.message, (e.filename || '') + ':' + (e.lineno || '') + ':' + (e.colno || ''),
       e.error && e.error.stack ? e.error.stack : ''].join('\n')
    );
  }, true);

  window.addEventListener('unhandledrejection', function (e) {
    var r = e.reason;
    show('未処理の例外', r && r.stack ? r.stack : String(r));
  });
})();
</script>

<style>
  :root {
    --bg: #14141a;
    --panel: #1e1e26;
    --line: #33333f;
    --text: #e8e8ef;
    --muted: #9a9aab;
    --p1: #4da3ff;
    --p2: #ff8a5c;
    --danger: #ff5566;
    --move: #4da3ff;
    --ok: #4fd18b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 12px;
    font-family: system-ui, -apple-system, "Hiragino Kaku Gothic ProN", sans-serif;
    background: var(--bg); color: var(--text);
    font-size: 14px;
  }
  h1 { font-size: .85rem; font-weight: 600; opacity: .5; margin: 0 0 8px; }

  #status {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 12px; margin-bottom: 10px;
  }
  #status .turn { font-weight: 700; }
  #status .active { color: var(--ok); font-weight: 600; }
  #status .gcosts { display: flex; gap: 8px; margin-left: auto; }
  #status .gc {
    background: #2a2a34; border: 1px solid var(--line);
    border-radius: 999px; padding: 2px 10px; font-size: .8rem;
  }
  #status .decks { font-size: .8rem; color: var(--muted); }

  .layout { display: grid; grid-template-columns: 1fr 300px; gap: 10px; align-items: start; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }

  .side {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 10px; margin-bottom: 8px;
  }
  .side-head { display: flex; gap: 10px; align-items: baseline; margin-bottom: 6px; }
  .side-head .pname { font-weight: 700; }
  .side-head .hcount { font-size: .78rem; color: var(--muted); }

  /* --- 盤面 --- */
  .board { display: flex; flex-direction: column; gap: 6px; margin: 8px 0; }
  .board-row { display: flex; gap: 6px; align-items: center; }
  .row-label { width: 16px; font-size: .7rem; color: var(--muted); flex: none; }
  .slot {
    position: relative;
    flex: 1; min-height: 84px;
    border: 1px dashed var(--line); border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    padding: 3px;
  }
  .slot.empty .slot-mark { font-size: .72rem; color: #4a4a58; }
  .slot.target { border: 2px solid var(--danger); border-style: solid; }
  .slot.protected { opacity: .45; }
  .slot.movable, .slot.placeable { border: 2px solid var(--move); border-style: solid; cursor: pointer; }
  .slot.planned { border-color: var(--ok); border-style: solid; }
  .plan-tag {
    position: absolute; bottom: 2px; left: 2px; right: 2px;
    font-size: .62rem; text-align: center; background: var(--ok); color: #06301c;
    border-radius: 3px; cursor: pointer; padding: 1px;
  }

  /* --- カード --- */
  .card {
    position: relative;
    width: 100%; max-width: 108px; min-height: 76px;
    background: #262631; border: 1px solid var(--line);
    border-left: 4px solid var(--line);
    border-radius: 6px; padding: 5px 6px;
    display: flex; flex-direction: column; gap: 3px;
  }
  .card.owner-p1 { border-left-color: var(--p1); }
  .card.owner-p2 { border-left-color: var(--p2); }
  .card.foreign { background: #2f2733; }
  .card.clickable { cursor: pointer; }
  .card.clickable:hover { filter: brightness(1.25); }
  .card.selected { outline: 2px solid var(--ok); }
  .card.dim { opacity: .4; }
  .card.compact { min-height: 68px; }

  .card-head { display: flex; gap: 5px; align-items: center; }
  .card-head .cost {
    background: #40405a; border-radius: 4px; padding: 0 5px;
    font-size: .72rem; font-weight: 700; flex: none;
  }
  .card-head .cname { font-size: .74rem; line-height: 1.15; overflow-wrap: anywhere; }
  .badge.todo { background: #6b5a2a; color: #ffd166; }
  .stats { display: flex; gap: 6px; margin-top: auto; font-weight: 700; font-size: .82rem; }
  .stats .atk::before { content: "⚔"; font-weight: 400; opacity: .6; margin-right: 2px; }
  .stats .hp::before { content: "❤"; font-weight: 400; opacity: .6; margin-right: 2px; }
  .stats .hp.hurt { color: var(--danger); }
  .card-foot { font-size: .62rem; color: var(--muted); }
  .card.owner-p1 .owner-tag { color: var(--p1); }
  .card.owner-p2 .owner-tag { color: var(--p2); }

  .badge {
    position: absolute; top: 2px; right: 2px;
    font-size: .6rem; border-radius: 3px; padding: 0 4px;
    background: #55556a;
  }
  .badge.pitched { background: var(--danger); }
  .badge.planned { background: var(--ok); color: #06301c; }
  .badge.used { background: #44444f; color: var(--muted); }
  /* 能力の印。todo（未）と重ならないよう位置をずらす */
  .badge.curse { background: #6b2a4a; color: #ff9ecb; top: auto; bottom: 2px; }
  .badge.morph { background: #2a5a6b; color: #9edcff; right: auto; left: 2px; }

  .card.back {
    background: repeating-linear-gradient(45deg, #2b2b38, #2b2b38 5px, #33333f 5px, #33333f 10px);
    border-left-color: var(--line);
    align-items: center; justify-content: center; min-height: 60px; max-width: 42px;
  }
  .back-mark { color: #55556a; font-weight: 700; }

  /* --- 手札 --- */
  .hand { display: flex; flex-wrap: wrap; gap: 6px; }
  .hand .card { max-width: 108px; }
  .hand.backs { gap: 3px; }
  .empty-note { font-size: .75rem; color: #55556a; padding: 6px; }

  /* --- ネクロマンサー --- */
  .necro {
    border: 1px solid var(--line); border-radius: 6px;
    padding: 6px 10px; margin: 6px 0;
    background: #24242e;
  }
  .necro.owner-p1 { border-left: 4px solid var(--p1); }
  .necro.owner-p2 { border-left: 4px solid var(--p2); }
  .necro.target { border: 2px solid var(--danger); cursor: pointer; }
  .necro.protected { opacity: .55; }
  .necro-name { font-size: .76rem; font-weight: 600; }
  .necro-hp { height: 7px; background: #3a3a48; border-radius: 4px; overflow: hidden; margin: 4px 0 2px; }
  .necro-hp-fill { height: 100%; background: var(--ok); }
  .necro-num { font-size: .72rem; color: var(--muted); }
  .necro-note { font-size: .66rem; color: var(--muted); margin-top: 3px; }

  /* --- 墓地 --- */
  #graves { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .grave { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
  .grave-head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; margin-bottom: 6px; }
  .grave-title { font-size: .78rem; font-weight: 600; }
  .grave-cost { font-size: .74rem; background: #2a2a34; border-radius: 999px; padding: 1px 8px; }
  .grave-count { font-size: .7rem; color: var(--muted); }
  .grave-src {
    font-size: .68rem; color: #06301c; background: var(--ok);
    border-radius: 999px; padding: 1px 8px; font-weight: 700;
  }
  .grave-list { display: flex; flex-wrap: wrap; gap: 4px; max-height: 190px; overflow-y: auto; }
  .grave-list .card { max-width: 92px; }

  /* --- 操作 --- */
  .controls {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 10px; margin-top: 8px;
  }
  button {
    font: inherit; font-size: .82rem;
    background: #33333f; color: var(--text);
    border: 1px solid var(--line); border-radius: 6px;
    padding: 6px 12px; cursor: pointer;
  }
  button:hover:not(:disabled) { filter: brightness(1.3); }
  button:disabled { opacity: .35; cursor: not-allowed; }
  button.primary { background: var(--ok); color: #06301c; border-color: transparent; font-weight: 700; }
  button.end { background: #4a3a55; }
  button.ghost { background: transparent; color: var(--muted); }
  .hint, .pt { font-size: .76rem; color: var(--muted); }
  .pt { font-weight: 700; color: var(--text); }
  .warn { font-size: .76rem; color: var(--danger); }
  .winner { font-weight: 700; color: var(--ok); }

  .msg { min-height: 18px; font-size: .78rem; color: var(--danger); padding: 4px 2px; }
  .msg.show { color: #ffd166; }

  /* --- 行動ログ（CG-010） --- */
  .log-title { font-size: .72rem; color: var(--muted); margin: 0 0 4px; font-weight: 600; }
  #actionlog {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 8px; max-height: 260px; overflow-y: auto;
    font-size: .78rem; line-height: 1.45; margin-bottom: 10px;
  }
  .al-line {
    padding: 3px 6px; border-left: 3px solid transparent; border-radius: 3px;
    overflow-wrap: anywhere;
  }
  .al-line + .al-line { margin-top: 2px; }
  .al-p1 { border-left-color: var(--p1); background: rgba(77, 163, 255, .07); }
  .al-p2 { border-left-color: var(--p2); background: rgba(255, 138, 92, .07); }
  .al-sys { color: var(--muted); }
  .al-turn {
    background: none; color: var(--muted); text-align: center;
    font-size: .72rem; letter-spacing: .04em; margin-top: 6px;
  }
  .al-attack { font-weight: 600; }
  .al-death { color: #ffb3bc; }
  .al-mill, .al-draw { color: var(--muted); font-size: .74rem; }
  .al-win { color: var(--ok); font-weight: 700; }

  /* --- 詳細ログ（engine が積んでいるもの） --- */
  #log {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 8px; height: 200px; overflow-y: auto; font-size: .72rem; line-height: 1.5;
  }
  .log-line { color: var(--muted); border-bottom: 1px solid #26262f; padding: 2px 0; }

  /* --- 攻撃エフェクト（CG-010） ---
     CSS アニメーションのみ。ライブラリも画像アセットも使わない。
     再生は投げっぱなしで、進行を待たせない（js/view.js の playPendingFx）。 */
  #fx { position: fixed; inset: 0; pointer-events: none; z-index: 40; overflow: hidden; }
  .fx { position: fixed; pointer-events: none; will-change: transform, opacity; }

  .fx-bolt {
    width: 20px; height: 20px; margin: -10px 0 0 -10px;
    border-radius: 50%;
    background: radial-gradient(circle, #fff 0%, var(--danger) 55%, rgba(255, 85, 102, 0) 100%);
    box-shadow: 0 0 14px 5px rgba(255, 85, 102, .55);
    animation: fx-bolt 200ms cubic-bezier(.35, 0, .85, .6) both;
  }
  @keyframes fx-bolt {
    0%   { transform: translate(0, 0) scale(.5); opacity: 0; }
    20%  { opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(1.2); opacity: .95; }
  }

  .fx-hit {
    border-radius: 7px;
    border: 2px solid var(--danger);
    background: rgba(255, 85, 102, .3);
    animation: fx-hit 240ms ease-out both;
  }
  @keyframes fx-hit {
    0%   { opacity: 0; transform: scale(1.18); }
    35%  { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: scale(.98); }
  }

  .fx-death {
    border-radius: 7px;
    background: radial-gradient(circle, rgba(255, 255, 255, .55), rgba(20, 20, 26, 0) 70%);
    animation: fx-death 380ms ease-in both;
  }
  @keyframes fx-death {
    0%   { opacity: .85; transform: scale(1) rotate(0); }
    100% { opacity: 0; transform: scale(.5) rotate(-14deg); }
  }

  @media (prefers-reduced-motion: reduce) {
    .fx-bolt { animation-duration: 90ms; }
    .fx-hit { animation-duration: 140ms; }
    .fx-death { animation-duration: 160ms; }
  }

  /* --- セットアップ --- */
  .setup {
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 12px; margin-bottom: 10px; font-size: .78rem;
  }
  .setup input[type="number"], .setup select {
    font: inherit; background: #26262f; color: var(--text);
    border: 1px solid var(--line); border-radius: 5px; padding: 4px 6px;
  }
  .setup input[type="number"] { width: 92px; }
  .cpu-tag {
    font-size: .7rem; background: #40405a; border-radius: 999px;
    padding: 1px 8px; margin-left: 4px;
  }

  /* --- デバッグパネル（CG-013） ---
     ルール切り替えと対戦ログの書き出し。デバッグ用なので簡素でよいが、
     畳んだままでも「今の対戦がどの設定か」は summary 行で常に見えるようにする。 */
  .debug {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 12px; margin-bottom: 10px; font-size: .78rem;
  }
  .debug summary { cursor: pointer; }
  .debug-title { color: var(--muted); font-weight: 600; margin-right: 8px; }
  .debug-summary { color: var(--text); }
  .debug-summary .changed { color: #ffd166; font-weight: 600; }
  .debug-summary .pending { color: #ffd166; }
  .debug-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 8px; }
  .debug-row select {
    font: inherit; background: #26262f; color: var(--text);
    border: 1px solid var(--line); border-radius: 5px; padding: 3px 6px;
  }
  .debug-note { color: var(--muted); margin-top: 6px; }
  .debug-msg { color: var(--ok); min-height: 14px; margin-top: 4px; }
  #matchlog-json {
    width: 100%; margin-top: 8px; font: 11px/1.4 ui-monospace, Consolas, monospace;
    background: #101016; color: var(--muted); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px; resize: vertical;
  }

  /* --- カーテン（ホットシートの目隠し） --- */
  .curtain { display: none; }
  .curtain.show {
    display: flex; flex-direction: column; gap: 12px;
    align-items: center; justify-content: center;
    position: fixed; inset: 0; z-index: 50;
    background: #0d0d12; text-align: center; padding: 20px;
  }
  .curtain-name { font-size: 1.3rem; font-weight: 700; }
  .curtain-note { font-size: .82rem; color: var(--muted); }

  /* --- 致命的エラーの表示（CG-008） --- */
  #fatal {
    display: none;
    position: relative; z-index: 100;
    background: #3a1620; border: 1px solid var(--danger); border-radius: 8px;
    padding: 10px 12px; margin-bottom: 10px;
  }
  .fatal-title { font-weight: 700; color: var(--danger); margin-bottom: 4px; }
  .fatal-detail {
    margin: 0 0 8px; font-size: .72rem; line-height: 1.45;
    color: #ffc6ce; white-space: pre-wrap; overflow-wrap: anywhere;
  }
</style>
</head>
<body>

<h1>持ち駒カードゲーム（仮） — プロト v0.2 ／ ローカル2人ホットシート・CPU 対戦</h1>

<div id="fatal"></div>

<div class="setup">
  <label>シード <input id="seed" type="number" value="12345"></label>
  <label>対戦相手
    <select id="matchup">
      <option value="hh">人間 vs 人間</option>
      <option value="hc">人間 vs CPU</option>
      <option value="cc">CPU vs CPU</option>
    </select>
  </label>
  <button id="new-game">このシードで新規対戦</button>
  <label><input id="curtain-toggle" type="checkbox" checked> ターン交代時に目隠しする</label>
  <span class="hint">同じシードなら同じ初期配置になります</span>
</div>

<!--
  デバッグパネル（CG-013）
  ルールの切り替え（次の新規対戦から反映）と、対戦ログの書き出し。
  中身は js/view.js が組み立てる。畳んでいても summary 行に
  「今の対戦がどの設定か」が常に出る。
-->
<details id="debug" class="debug">
  <summary><span class="debug-title">⚙ デバッグ（ルール切り替え・対戦ログ）</span><span
      id="debug-summary" class="debug-summary"></span></summary>
  <div id="debug-body"></div>
</details>

<div id="status"></div>

<div class="layout">
  <div>
    <div id="foe-area" class="side"></div>
    <div id="self-area" class="side"></div>
    <div id="message" class="msg"></div>
    <div id="controls"></div>
    <div id="graves"></div>
  </div>
  <div>
    <div class="log-title">行動ログ（直近10行）</div>
    <div id="actionlog"></div>
    <div class="log-title">詳細ログ</div>
    <div id="log"></div>
  </div>
</div>

<div id="fx"></div>
<div id="curtain" class="curtain"></div>

<!--
  素の <script> で順に読む（CG-008）
  ★ type="module" にしないこと。file:// から開くと CORS で弾かれて何も動かない。
    作者は index.html をダブルクリックで開く。ローカルサーバは前提にしない。
  読み込み順は データ → engine → ai → view の固定。
-->
<script src="data/cards.js"></script>
<script src="data/ai.js"></script>
<script src="js/engine.js"></script>
<script src="js/ai.js"></script>
<script src="js/view.js"></script>

<script>
(function () {
  var missing = [];
  if (!window.NECRO_CARDS) missing.push('data/cards.js');
  if (!window.NECRO_AI) missing.push('data/ai.js');
  if (!window.NECRO_ENGINE) missing.push('js/engine.js');
  if (!window.NECRO_AI_CPU) missing.push('js/ai.js');
  if (missing.length) {
    window.NECRO_FATAL(
      '読み込めていないファイルがあります',
      missing.join('\n') +
        '\n\nindex.html と同じ場所に data/ と js/ がそろっているか確認してください。'
    );
  }
})();
</script>

</body>
</html>
